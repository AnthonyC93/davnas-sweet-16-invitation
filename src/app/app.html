<canvas id="canvas"></canvas>

<div class="safe-area">
    <div class="page-1 animate__animated text-xl h-screen flex flex-col gap-8 justify-center items-center" animate.enter="animate__fadeInLeft">
        <div>
            <h2>You are invited to</h2>
            <h1 class="script">Davna Ceron's</h1>
        </div>
    
        <div>
            <h1 class="script">Sweet 16</h1>
            <h2>March 8, 2026</h2>
        </div>
    </div>
    
    <div class="page-2 animate__animated h-screen flex flex-col gap-8 justify-center items-center" animate.enter="animate__fadeInLeft">
        <h1>The Details</h1>
    
        @for (item of details; track $index) {
            <div class="flex items-center gap-8">
                <div class="circle h-8 w-8 rounded-full bg-orange-300">
                    <img [src]="item.img" alt="">
                </div>
    
                <div class="flex flex-col gap-3">
                    <h3>{{item.title}}</h3>
                    <ul>
                        @for (listItem of item.list; track $index) {
                            <li>{{listItem}}</li>
                        }
                    </ul>
                </div>
            </div>
        }
    </div>
    
    <div class="page-3 animate__animated h-screen flex flex-col gap-8 justify-center items-center" animate.enter="animate__fadeInLeft">
        <h1>RSVP</h1>
        <h3>by January 14</h3>
    
        <iframe src="https://invitarium.io/f/d7b93f413f26560fb6" frameborder="0" class="w-[75vw] max-w-[600px] h-[700px]" scrolling="no"></iframe>
    </div> 
</div>
